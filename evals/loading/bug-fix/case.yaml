schema_version: "1.1"
name: loading-bug-fix
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-bug-fix
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/bug-fix\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(feature|prototype|perf)\.md'
    min: 0
    max: 0
  - name: loads-fix-root-causes
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:pickle:)?principle-fix-root-causes"'
  - name: loads-test-behavior
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:pickle:)?principle-test-behavior"'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(bug-fix)'
    target: last_message

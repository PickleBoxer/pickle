schema_version: "1.1"
name: loading-ambiguous-feature-or-refactor
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-feature-or-refactor
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(feature|refactor)\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(prototype|perf)\.md'
    min: 0
    max: 0
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(feature|refactor)'
    target: last_message

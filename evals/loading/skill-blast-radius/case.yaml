schema_version: "1.1"
name: loading-skill-blast-radius
context:
  scaffold_script: scaffold.sh
graders:
  - name: calls-blast-radius
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?blast-radius"'
  - name: skips-other-skills
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?(how|why|architect|interrogate|swarm|tdd)"'
    min: 0
    max: 0

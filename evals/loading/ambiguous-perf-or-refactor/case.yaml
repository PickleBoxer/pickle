schema_version: "1.1"
name: loading-ambiguous-perf-or-refactor
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-perf-or-refactor
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(perf|refactor)\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(feature|prototype)\.md'
    min: 0
    max: 0
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(perf|refactor)'
    target: last_message

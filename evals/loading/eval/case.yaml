schema_version: "1.1"
name: loading-eval
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-eval
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/eval\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(feature|bug-fix)\.md'
    min: 0
    max: 0
  - name: loads-prove-it-works
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/prove-it-works\.md'
  - name: loads-conventions
    type: tool_used
    tool: Read
    input_match: 'docs/conventions\.md'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(eval)'
    target: last_message

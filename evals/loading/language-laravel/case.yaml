schema_version: "1.1"
name: loading-language-laravel
context:
  scaffold_script: scaffold.sh
graders:
  - name: names-laravel-skill
    type: regex
    pattern: 'Loaded:.*docs/conventions\.md.*laravel-best-practices'
    target: last_message
  - name: reads-feature
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/feature\.md'

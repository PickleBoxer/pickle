schema_version: "1.1"
name: loading-multi-phase-plan
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-multi-phase-plan
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/multi-phase-plan\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(prototype)\.md'
    min: 0
    max: 0
  - name: loads-small-verified-steps
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:pickle:)?principle-small-verified-steps"'
  - name: loads-finish-migrations
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:pickle:)?principle-finish-migrations"'
  - name: loads-no-shared-writes
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:pickle:)?principle-no-shared-writes"'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(multi-phase-plan)'
    target: last_message

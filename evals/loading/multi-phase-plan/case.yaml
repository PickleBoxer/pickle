schema_version: "1.1"
name: loading-multi-phase-plan
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-multi-phase-plan
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/multi-phase-plan\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(prototype)\.md'
    min: 0
    max: 0
  - name: loads-small-verified-steps
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/small-verified-steps\.md'
  - name: loads-finish-migrations
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/finish-migrations\.md'
  - name: loads-no-shared-writes
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/no-shared-writes\.md'
  - name: loads-pack-php
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/packs/php\.md'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(multi-phase-plan)'
    target: last_message

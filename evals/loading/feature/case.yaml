schema_version: "1.1"
name: loading-feature
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-feature
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/feature\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(bug-fix|perf|investigate|runtime-forensics|trace-forensics)\.md'
    min: 0
    max: 0
  - name: loads-model-the-domain
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:pickle:)?principle-model-the-domain"'
  - name: loads-types
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:pickle:)?principle-types"'
  - name: loads-finish-migrations
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:pickle:)?principle-finish-migrations"'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(feature)'
    target: last_message

schema_version: "1.1"
name: loading-feature
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-feature
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/feature\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(bug-fix|refactor|perf|investigate|runtime-forensics|trace-forensics)\.md'
    min: 0
    max: 0
  - name: loads-model-the-domain
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/model-the-domain\.md'
  - name: loads-types
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/types\.md'
  - name: loads-conventions
    type: tool_used
    tool: Read
    input_match: 'docs/conventions\.md'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(feature)'
    target: last_message

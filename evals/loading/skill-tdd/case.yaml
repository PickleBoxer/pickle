schema_version: "1.1"
name: loading-skill-tdd
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-bug-fix
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/bug-fix\.md'
  - name: loads-test-behavior
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/test-behavior\.md'
  - name: calls-tdd
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?tdd"'
  - name: skips-other-skills
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?(how|architect|interrogate|swarm)"'
    min: 0
    max: 0

schema_version: "1.1"
name: loading-skill-no-comments
context:
  scaffold_script: scaffold.sh
graders:
  - name: calls-no-comments
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?no-comments"'
  - name: skips-other-skills
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?(how|architect|interrogate|swarm|unslop|technical-writing)"'
    min: 0
    max: 0

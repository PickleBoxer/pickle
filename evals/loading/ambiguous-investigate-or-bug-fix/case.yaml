schema_version: "1.1"
name: loading-ambiguous-investigate-or-bug-fix
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-investigate-or-bug-fix
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(investigate|bug-fix)\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(feature|prototype)\.md'
    min: 0
    max: 0
  - name: loads-conventions
    type: tool_used
    tool: Read
    input_match: 'docs/conventions\.md'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(investigate|bug-fix)'
    target: last_message

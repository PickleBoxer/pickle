schema_version: "1.1"
name: loading-session-pickup
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-session-pickup
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/session-pickup\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(prototype)\.md'
    min: 0
    max: 0
  - name: loads-guard-the-context
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/guard-the-context\.md'
  - name: loads-pack-php
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/packs/php\.md'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(session-pickup)'
    target: last_message

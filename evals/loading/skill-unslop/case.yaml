schema_version: "1.1"
name: loading-skill-unslop
context:
  scaffold_script: scaffold.sh
graders:
  - name: calls-unslop
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?unslop"'
  - name: skips-other-skills
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?(how|architect|interrogate|swarm|tdd)"'
    min: 0
    max: 0

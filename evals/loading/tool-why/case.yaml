schema_version: "1.1"
name: loading-tool-why
context:
  scaffold_script: scaffold.sh
graders:
  - name: calls-why
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?why"'
  - name: skips-other-tools
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?(how|architect|interrogate|swarm)"'
    min: 0
    max: 0

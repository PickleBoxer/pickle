schema_version: "1.1"
name: loading-skill-show-me-your-work
context:
  scaffold_script: scaffold.sh
graders:
  - name: calls-show-me-your-work
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?show-me-your-work"'
  - name: skips-other-skills
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?(how|architect|interrogate|swarm|tdd)"'
    min: 0
    max: 0

schema_version: "1.1"
name: loading-language-typescript
context:
  scaffold_script: scaffold.sh
graders:
  - name: loads-typescript-skill
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?typescript-best-practices"'
  - name: project-conventions-first
    type: tool_order
    before:
      tool: Read
      input_match: 'docs/conventions\.md'
    after:
      tool: Skill
      input_match: '"(pickle:)?typescript-best-practices"'
  - name: reads-feature
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/feature\.md'
  - name: loads-types
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/types\.md'

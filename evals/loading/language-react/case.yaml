schema_version: "1.1"
name: loading-language-react
context:
  scaffold_script: scaffold.sh
graders:
  - name: loads-typescript-skill
    type: tool_used
    tool: Skill
    input_match: '"(pickle:)?typescript-best-practices"'
  - name: names-react-skill
    type: regex
    pattern: 'Loaded:.*docs/conventions\.md.*typescript-best-practices.*vercel-react-best-practices'
    target: last_message
  - name: project-conventions-first
    type: tool_order
    before:
      tool: Read
      input_match: 'docs/conventions\.md'
    after:
      tool: Skill
      input_match: '"(pickle:)?typescript-best-practices"'
  - name: reads-feature
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/feature\.md'

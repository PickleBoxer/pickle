schema_version: "1.1"
name: loading-pause-safely
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-pause-safely
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/pause-safely\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(feature|prototype)\.md'
    min: 0
    max: 0
  - name: loads-guard-the-context
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/guard-the-context\.md'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(pause-safely)'
    target: last_message

schema_version: "1.1"
name: loading-opening-a-pr
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-opening-a-pr
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/opening-a-pr\.md'
  - name: skips-wrong-playbooks
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/playbooks/(feature|bug-fix)\.md'
    min: 0
    max: 0
  - name: loads-minimize-reader-load
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/principles/minimize-reader-load\.md'
  - name: loads-pack-php
    type: tool_used
    tool: Read
    input_match: 'pickle-mode/packs/php\.md'
  - name: reports-loaded
    type: regex
    pattern: 'Loaded:.*(opening-a-pr)'
    target: last_message

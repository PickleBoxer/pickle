name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/claude-code plugin validate . --strict
      # No long dashes in shipped text, see AGENTS.md
      - run: |
          ! LC_ALL=C.UTF-8 grep -rnIP --exclude-dir=.git '[\x{2013}\x{2014}]' .
      # Skill, principle and agent mentions resolve; UPSTREAM.md matches the files
      - run: bash scripts/check-refs.sh
